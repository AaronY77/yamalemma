[models.reader]
provider = "openai"
model = "gpt-6-sol"
reasoning = "medium"
max_output_tokens = 4096
timeout = 120
key_env = "OPENAI_API_KEY"
input_usd_per_million = 2.0
output_usd_per_million = 10.0
pricing_date = "2026-10-17"
pricing_source = "https://developers.openai.com/api/docs/models/gpt-6-sol"

[models.writer]
provider = "openai"
model = "gpt-6-sol"
reasoning = "medium"
max_output_tokens = 4096
timeout = 120
key_env = "OPENAI_API_KEY"
input_usd_per_million = 2.0
output_usd_per_million = 10.0
pricing_date = "2026-10-17"
pricing_source = "https://developers.openai.com/api/docs/models/gpt-6-sol"

[stages]
backtranslation = false
triage = true
second_reader = false
fixes = false

[limits]
max_repairs = 0
max_claims = 1
max_calls = 3
max_cost_usd = 0.25
max_input_bytes = 12000
