[project]
name = "yamalemma"
version = "0.1.0"
description = "Controlled Lean evidence for formal benchmark faithfulness auditing"
readme = "README.md"
authors = [
    { name = "AaronY77", email = "arunyama8@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.23,<5",
]

[project.scripts]
yamalemma = "yamalemma.cli:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
